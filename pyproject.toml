[project]
name = "rotate-ocsvm-gc"
version = "0.1.0"
description = "Garbage-collecting a knowledge graph with a one-class SVM over RotatE embeddings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Pinned to the versions that produced everything in results/. scikit-learn in
# particular does not promise bit-identical SVM output across minor releases, so
# an unpinned install reproduces the conclusions but not the committed numbers.
# Widen these deliberately, not by accident.
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Stage 4b (replicate_original.py) only. Kept out of the default dependencies
# because umap-learn drags in numba; on Longleaf it lives in a separate env.
# See reference/slurm.md, PYTHON_UMAP.
umap = [
    "umap-learn",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# legacy/ is a frozen record of a run that happened, kept for cross-checking.
# Reformatting it would defeat the point of keeping it.
extend-exclude = ["legacy", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
