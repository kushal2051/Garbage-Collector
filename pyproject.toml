[project]
name = "rotate-ocsvm-gc"
version = "0.1.0"
description = "Garbage-collecting a knowledge graph with a one-class SVM over RotatE embeddings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Stage 4b (replicate_original.py) only. Kept out of the default dependencies
# because umap-learn drags in numba; on Longleaf it lives in a separate env.
# See reference/slurm.md, PYTHON_UMAP.
umap = [
    "umap-learn",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# legacy/ is a frozen record of a run that happened, kept for cross-checking.
# Reformatting it would defeat the point of keeping it.
extend-exclude = ["legacy", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
